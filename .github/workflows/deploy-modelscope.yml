name: Deploy to ModelScope

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelscope-montec-bom-pilot
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/feat/gradio-decision-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies before application source is available
        run: |
          deps_dir=$(mktemp -d "$RUNNER_TEMP/bom-pilot-deps.XXXXXX")
          cp requirements.txt "$deps_dir/"
          cd "$deps_dir"
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install 'pytest>=8,<10'
          echo "$deps_dir/.venv/bin" >> "$GITHUB_PATH"
      - name: Check dependencies and run tests
        run: |
          python -m pip check
          # The CLI test starts a child interpreter, outside pytest's import path.
          PYTHONPATH="$PWD/src" python -m pytest -q
      - name: Check that Gradio listens on the cloud interface
        run: bash scripts/check_deployment_startup.sh

  deploy:
    if: github.ref == 'refs/heads/feat/gradio-decision-workbench'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Commit and push managed deployment files
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: bash scripts/deploy_modelscope.sh
