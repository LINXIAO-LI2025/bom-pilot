name: Deploy to ModelScope

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelscope-montec-bom-pilot
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/feat/gradio-decision-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deployment dependencies and run tests
        run: |
          python -m pip install -r requirements.txt -e '.[test]'
          python -m pip check
          python -m pytest -q
      - name: Check that Gradio listens on the cloud interface
        run: bash scripts/check_deployment_startup.sh

  deploy:
    if: github.ref == 'refs/heads/feat/gradio-decision-workbench'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Commit and push managed deployment files
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_USERNAME: ${{ vars.MODELSCOPE_USERNAME || 'MONTEC' }}
        run: bash scripts/deploy_modelscope.sh
