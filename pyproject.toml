[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bom-pilot"
version = "0.1.0"
description = "Auditable BOM data and procurement cost engine"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bom-pilot = "bom_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
